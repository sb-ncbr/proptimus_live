{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "proptimus.fullname" . }}-job-manager
  labels:
    {{- include "proptimus.labels" (dict "root" . "component" "api") | nindent 4 }}
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "proptimus.fullname" . }}-job-manager
  labels:
    {{- include "proptimus.labels" (dict "root" . "component" "api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "proptimus.fullname" . }}-job-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "proptimus.serviceAccountName" (dict "root" . "component" "api") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
