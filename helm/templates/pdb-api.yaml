{{- if .Values.podDisruptionBudget.api.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "proptimus.fullname" . }}-api
  labels:
    {{- include "proptimus.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.api.minAvailable }}
  selector:
    matchLabels:
      {{- include "proptimus.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}


