{{- range $component := list "api" "ui" "worker" }}
{{- $account := index $.Values.serviceAccounts $component }}
{{- if $account.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "proptimus.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "proptimus.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $account.automountServiceAccountToken }}
{{- end }}
{{- end }}

