stages:
  - build-api
  - build-ui
  - deploy

image:
  name: gcr.io/kaniko-project/executor:v1.24.0-debug
  entrypoint: [""]

variables:
  UI_BUILD_ARG_APP_NAME: "Proptimus"
  UI_BUILD_ARG_API_URL: "https://api.proptimus.biodata.ceitec.cz"
  UI_BUILD_DEVEL_ARG_API_URL: "https://api.devel.proptimus.biodata.ceitec.cz"

build-prod-api-image:
  stage: build-api
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/api/proptimus-api"
        --dockerfile "Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}/api:latest"
        --cache=true
        --cache-ttl=168h
        --snapshot-mode=redo
        --compressed-caching=false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'

build-devel-api-image:
  stage: build-api
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/api/proptimus-api"
        --dockerfile "Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_REF_SLUG}"
        --cache=true
        --cache-ttl=168h
        --snapshot-mode=redo
        --compressed-caching=false
  rules:
    - if: '$CI_COMMIT_BRANCH != "master" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - api/**

build-prod-ui-image:
  stage: build-ui
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/ui/proptimus-ui"
        --dockerfile "Dockerfile"
        --build-arg NEXT_PUBLIC_APP_NAME="${UI_BUILD_ARG_APP_NAME}"
        --build-arg NEXT_PUBLIC_API_URL="${UI_BUILD_ARG_API_URL}"
        --destination "${CI_REGISTRY_IMAGE}/ui:latest"
        --cache=true
        --cache-ttl=168h
        --snapshot-mode=redo
        --compressed-caching=false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'

build-devel-ui-image:
  stage: build-ui
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/ui/proptimus-ui"
        --dockerfile "Dockerfile"
        --build-arg NEXT_PUBLIC_APP_NAME="${UI_BUILD_ARG_APP_NAME}"
        --build-arg NEXT_PUBLIC_API_URL="${UI_BUILD_DEVEL_ARG_API_URL}"
        --destination "${CI_REGISTRY_IMAGE}/ui:${CI_COMMIT_REF_SLUG}"
        --cache=true
        --cache-ttl=168h
        --snapshot-mode=redo
        --compressed-caching=false
  rules:
    - if: '$CI_COMMIT_BRANCH != "master" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - ui/**

deploy-devel:
  stage: deploy
  image: alpine:3.23
  needs:
    - job: build-devel-api-image
      optional: true
    - job: build-devel-ui-image
      optional: true
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        cd $DEPLOY_PATH
        echo '$CI_REGISTRY_PASSWORD' | docker login $CI_REGISTRY -u '$CI_REGISTRY_USER' --password-stdin
        docker compose pull --quiet devel-api devel-ui
        docker compose up -d devel-api devel-ui
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "devel" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - api/**
        - ui/**
  environment:
    name: devel
    url: https://devel.proptimus.biodata.ceitec.cz
  resource_group: devel
